<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Flipbook</title>

    <!-- Load libraries from CDN (works in SCORM) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Georgia, 'Times New Roman', Times, serif;
            background: linear-gradient(135deg, #52252e 0%, #52252e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .flipbook-container {
            background: #fbf7eb;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 20px;
            margin: 20px 0;
            width: 100%;
            max-width: 900px;
        }

        .flip-book {
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .page {
            background: #fbf7eb;
            overflow: hidden;
        }

        .page-content {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .page-content canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background: #52252e;
            color: #fbf7eb;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #425a3e;
        }

        button:disabled {
            background: #fbf7eb;
            cursor: not-allowed;
        }

        .page-info {
            margin-top: 15px;
            font-size: 14px;
            color: #52252e;
            text-align: center;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 18px;
            color: #52252e;
        }

        .error-message {
            text-align: center;
            padding: 40px;
            font-size: 16px;
            color: #f79d60;
            background: #fbf7eb;
            border-radius: 8px;
            margin: 20px;
        }

        .file-picker-container {
            background: #fbf7eb;
            border-radius: 10px;
            padding: 30px;
            margin: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .file-picker-container h2 {
            color: #52252e;
            margin-bottom: 20px;
        }

        .file-input-wrapper {
            margin: 20px 0;
        }

        input[type="file"] {
            display: none;
        }

        .custom-file-upload {
            display: inline-block;
            padding: 15px 30px;
            background: #52252e;
            color: #fbf7eb;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }

        .custom-file-upload:hover {
            background: #52252e;
        }

        .file-name {
            margin-top: 15px;
            font-size: 14px;
            color: #52252e;
        }

        .instructions {
            background: #fbf7eb;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            width: 100%;
            max-width: 900px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .instructions h2 {
            color: #52252e;
            margin-bottom: 15px;
        }

        .instructions ol {
            margin-left: 20px;
            line-height: 1.8;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>


    <!-- Flipbook (hidden until PDF is loaded) -->
    <div id="flipbookSection" class="flipbook-container hidden">
        <div id="flipbook" class="flip-book">
            <div class="loading">Loading PDF...</div>
        </div>

        <div class="controls">
            <button id="prevBtn" onclick="goToPrevPage()">Previous</button>
            <button id="nextBtn" onclick="goToNextPage()">Next</button>
            <button id="firstBtn" onclick="goToFirstPage()">First</button>
            <button id="lastBtn" onclick="goToLastPage()">Last</button>
            <button id="newFileBtn" onclick="loadNewFile()">New File</button>
        </div>

        <div class="page-info">
            Page: <span id="currentPage">1</span> of <span id="totalPages">--</span>
        </div>
    </div>


    <script>
        // ==================== CONFIGURATION ====================
        // Set this to a PDF URL to auto-load on page start
        // For SCORM, you can also upload PDFs to the same folder
        // Examples:
        //   const autoLoadPDF = 'mybook.pdf';
        //   const autoLoadPDF = 'https://example.com/file.pdf';
        //   const autoLoadPDF = null;  // Show file picker instead
        const autoLoadPDF = 'https://arca.mac.edu.au/pluginfile.php/4548/mod_resource/content/1/Assessment%20Guide%202026%20-%20Referencing.pdf';

        // Flipbook dimensions (adjust based on your PDF aspect ratio)
        const flipbookWidth = 1000;
        const flipbookHeight = 800;
        // =======================================================

        let pdfDoc = null;
        let pageFlip = null;
        let currentPage = 1;
        let totalPages = 0;

        // Initialize PDF.js worker
        if (typeof pdfjsLib !== 'undefined') {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }

        // File input handler
        document.getElementById('pdfInput').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (file && file.type === 'application/pdf') {
                document.getElementById('fileName').textContent = 'Selected: ' + file.name;
                await loadPDFFromFile(file);
            } else {
                alert('Please select a valid PDF file.');
            }
        });

        // Load PDF from file input
        async function loadPDFFromFile(file) {
            try {
                const arrayBuffer = await file.arrayBuffer();

                // Show flipbook section, hide file picker
                document.getElementById('filePickerSection').classList.add('hidden');
                document.getElementById('flipbookSection').classList.remove('hidden');

                await loadPDF(arrayBuffer);
            } catch (error) {
                console.error('Error loading PDF from file:', error);
                showError('Error loading PDF file. Please try another file.');
            }
        }

        // Load PDF from URL or ArrayBuffer
        async function loadPDF(pdfSource) {
            try {
                // Clear any existing flipbook
                if (pageFlip) {
                    pageFlip.destroy();
                    pageFlip = null;
                }

                document.getElementById('flipbook').innerHTML = '<div class="loading">Loading PDF...</div>';

                // Load the PDF document
                if (pdfSource instanceof ArrayBuffer) {
                    pdfDoc = await pdfjsLib.getDocument({ data: pdfSource }).promise;
                } else {
                    pdfDoc = await pdfjsLib.getDocument(pdfSource).promise;
                }

                totalPages = pdfDoc.numPages;
                document.getElementById('totalPages').textContent = totalPages;

                // Clear loading message
                document.getElementById('flipbook').innerHTML = '';

                // Create PageFlip instance
                pageFlip = new St.PageFlip(document.getElementById('flipbook'), {
                    width: flipbookWidth,
                    height: flipbookHeight,
                    size: 'fixed',
                    display: 'double',
                    showCover: true,
                    mobileScrollSupport: false
                });

                // Load all pages
                const pages = [];
                for (let i = 1; i <= totalPages; i++) {
                    document.getElementById('currentPage').textContent = i;

                    const page = await pdfDoc.getPage(i);
                    const viewport = page.getViewport({ scale: 1.5 });

                    // Create canvas for this page
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    // Render PDF page to canvas
                    await page.render({
                        canvasContext: context,
                        viewport: viewport
                    }).promise;

                    // Create page element
                    const pageDiv = document.createElement('div');
                    pageDiv.className = 'page';
                    pageDiv.innerHTML = '<div class="page-content"></div>';
                    pageDiv.querySelector('.page-content').appendChild(canvas);

                    pages.push(pageDiv);
                }

                // Add pages to flipbook
                pageFlip.loadFromHTML(pages);

                // Update current page on flip
                pageFlip.on('flip', (e) => {
                    currentPage = e.data + 1;
                    document.getElementById('currentPage').textContent = currentPage;
                    updateButtons();
                });

                updateButtons();

            } catch (error) {
                console.error('Error loading PDF:', error);
                showError('Error loading PDF. Please check the file and try again.<br><br>Details: ' + error.message);
            }
        }

        // Show error message
        function showError(message) {
            document.getElementById('flipbook').innerHTML = 
                '<div class="error-message">' + message + '</div>';
        }

        // Load new file
        function loadNewFile() {
            if (pageFlip) {
                pageFlip.destroy();
                pageFlip = null;
            }
            pdfDoc = null;
            currentPage = 1;
            totalPages = 0;

            document.getElementById('flipbookSection').classList.add('hidden');
            document.getElementById('filePickerSection').classList.remove('hidden');
            document.getElementById('pdfInput').value = '';
            document.getElementById('fileName').textContent = '';
        }

        // Navigation functions
        function goToPrevPage() {
            if (pageFlip) {
                pageFlip.flipPrev();
            }
        }

        function goToNextPage() {
            if (pageFlip) {
                pageFlip.flipNext();
            }
        }

        function goToFirstPage() {
            if (pageFlip) {
                pageFlip.flip(0);
            }
        }

        function goToLastPage() {
            if (pageFlip) {
                pageFlip.flip(totalPages - 1);
            }
        }

        function updateButtons() {
            document.getElementById('prevBtn').disabled = currentPage <= 1;
            document.getElementById('nextBtn').disabled = currentPage >= totalPages;
            document.getElementById('firstBtn').disabled = currentPage <= 1;
            document.getElementById('lastBtn').disabled = currentPage >= totalPages;
        }

        // Initialize on page load
        window.addEventListener('load', function() {
            if (autoLoadPDF) {
                // Auto-load PDF if URL is provided
                document.getElementById('filePickerSection').classList.add('hidden');
                document.getElementById('flipbookSection').classList.remove('hidden');
                loadPDF(autoLoadPDF);
            }
        });
    </script>
</body>
</html>
